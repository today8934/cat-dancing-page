<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat body -->
  <ellipse cx="100" cy="130" rx="50" ry="35" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>

  <!-- Cat head -->
  <circle cx="100" cy="80" r="40" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>

  <!-- Cat ears -->
  <path d="M 75 50 L 65 25 L 90 35 Z" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>
  <path d="M 125 50 L 135 25 L 110 35 Z" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>
  <path d="M 75 45 L 70 32 L 85 38 Z" fill="#FFB366"/>
  <path d="M 125 45 L 130 32 L 115 38 Z" fill="#FFB366"/>

  <!-- Cat eyes -->
  <ellipse cx="88" cy="75" rx="8" ry="12" fill="#2C3E50"/>
  <ellipse cx="112" cy="75" rx="8" ry="12" fill="#2C3E50"/>
  <ellipse cx="88" cy="72" rx="3" ry="5" fill="#ECF0F1"/>
  <ellipse cx="112" cy="72" rx="3" ry="5" fill="#ECF0F1"/>

  <!-- Cat nose -->
  <path d="M 100 85 L 95 92 L 105 92 Z" fill="#E74C3C"/>

  <!-- Cat mouth -->
  <path d="M 100 92 Q 90 100 85 95" stroke="#2C3E50" stroke-width="2" fill="none"/>
  <path d="M 100 92 Q 110 100 115 95" stroke="#2C3E50" stroke-width="2" fill="none"/>

  <!-- Cat whiskers -->
  <line x1="60" y1="80" x2="40" y2="75" stroke="#2C3E50" stroke-width="2"/>
  <line x1="60" y1="88" x2="40" y2="88" stroke="#2C3E50" stroke-width="2"/>
  <line x1="60" y1="96" x2="40" y2="100" stroke="#2C3E50" stroke-width="2"/>
  <line x1="140" y1="80" x2="160" y2="75" stroke="#2C3E50" stroke-width="2"/>
  <line x1="140" y1="88" x2="160" y2="88" stroke="#2C3E50" stroke-width="2"/>
  <line x1="140" y1="96" x2="160" y2="100" stroke="#2C3E50" stroke-width="2"/>

  <!-- Cat tail -->
  <path d="M 145 140 Q 180 120 175 90 Q 170 100 165 130" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>

  <!-- Cat legs -->
  <ellipse cx="75" cy="175" rx="8" ry="20" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>
  <ellipse cx="95" cy="175" rx="8" ry="20" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>
  <ellipse cx="105" cy="175" rx="8" ry="20" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>
  <ellipse cx="125" cy="175" rx="8" ry="20" fill="#FF8C42" stroke="#FF6B1A" stroke-width="2"/>

  <!-- Cat paws -->
  <ellipse cx="75" cy="188" rx="10" ry="6" fill="#2C3E50"/>
  <ellipse cx="95" cy="188" rx="10" ry="6" fill="#2C3E50"/>
  <ellipse cx="105" cy="188" rx="10" ry="6" fill="#2C3E50"/>
  <ellipse cx="125" cy="188" rx="10" ry="6" fill="#2C3E50"/>
</svg>